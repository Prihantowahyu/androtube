name: Build RinganTube Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Find and Rename APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/RinganTube-Android.apk \;
          echo "=== APK Info ==="
          ls -lh output_apk/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RinganTube-Android-APK
          path: output_apk/RinganTube-Android.apk
          retention-days: 30

      - name: Publish GitHub Release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RinganTube Android ${{ github.ref_name }}
          files: output_apk/RinganTube-Android.apk
          generate_release_notes: true

      - name: Job Summary
        run: |
          echo "### 🚀 APK RinganTube Berhasil Dibuat!" >> $GITHUB_STEP_SUMMARY
          echo "File APK siap diunduh di tab **Artifacts** di atas atau via GitHub Release." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Fitur | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| YouTube Lite Native | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Unduh Offline Video & Audio | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| TikTok Lite Sandbox | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Instagram Lite Sandbox | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| PiP / Floating Window | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Sleep Timer | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Playback Speed | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Gesture Volume & Brightness | ✅ |" >> $GITHUB_STEP_SUMMARY
